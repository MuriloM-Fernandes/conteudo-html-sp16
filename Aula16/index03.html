<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula16 - HTML</title>
</head>
<body>

    <h1>Formulários no HTML</h1>

    <form>
        <label for="">Primeiro Nome:</label><br>
        <input type="text" name="pnome" id="pnome"><br>
        <label for="snome">Segundo Nome:</label><br>
        <input type="text" name="snome" id="snome"><br>
        <input type="button" value="Enviar"><br>
    </form>

    <hr>

    <h3>Inputs tipo Radio</h3>

    <form>
        <input type="radio" name="op" id="op-html">
        <label for="op-html">HTML</label>
        <br>
        <input type="radio" name="op-css" id="op-css">
        <label for="op-css">CSS</label>
        <br>
        <input type="radio" name="op-js" id="op-js">
        <label for="op-js">JavaScript</label>
    </form>
    
    <hr>

    <h3>Inputs tipo checkbox</h3>

    <form>
        <input type="checkbox" name="frutas1" id="f-pera" value="Pera">
        <label for="f-pera">Pera</label>
        <br>
        <input type="checkbox" name="frutas2" id="f-abacaxi" value="Abacaxi">
        <label for="f-abacaxi">Abacaxi</label>
        <br>
        <input type="checkbox" name="frutas3" id="f-pitaya" value="Pitaya">
        <label for="f-pitaya">Pitaya</label>
        <br>
    </form>

</body>
</html>
