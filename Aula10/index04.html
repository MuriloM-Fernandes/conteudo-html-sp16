<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula10 - HTML</title>
</head>
<body>
    <h1>Listas no HTML</h1>

    <h3>Exemplo de lista não ordena no HTML</h3>

    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>

    <hr>

    <h3>Exemplo de lista ordenada</h3>

    <ol>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
    </ol>

    <hr>

    <h3>Exemplo de lista de descrição</h3>

    <dl>
        <dt>Carro</dt>
        <dd>Veículo que possui 4 rodas</dd>
        <li><img src="gatito.gif"></li>
        <br>
        <dt>Moto</dt>
        <dd>Veículo que possui 2 rodas</dd>
        <li><img src="gatito.gif"></li>
    </dl>
</body>
</html>
