<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula11 - HTML</title>
</head>
<body>
    <h1>Div no HTML</h1>

    <div style="background-color: crimson; font-family: sans-serif; color: ghostwhite; padding: 20px;">
        <h2>Isso é um h2</h2>
        <p>Isso é um cachorro</p>
        <p>Isso é outro cachorro</p>
    </div>

    <p>Isso é uma girafa fora da div</p>

    <hr>

    <h3>Centralizando DIV na Página</h3>

    <div style="background-color: orange; font-family: sans-serif; padding: 20px; width: 200px; margin: auto;">
        <h2>Isso é um h2</h2>
        <p>Isso é um cachorro</p>
        <p>Isso é outro cachorro</p>
    </div>
</body>
</html>
